name: Feature Request
description: 为 LLC 增益曲线可视化工具提出新功能建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题？
      description: 描述当前工具的不足或你的使用场景
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的功能
      description: 你希望新增什么功能？可以描述交互方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式？

  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 参考资料、相关论文或截图等（请勿包含敏感信息）